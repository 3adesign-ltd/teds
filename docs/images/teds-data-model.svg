<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>The TEDS data model</title>
  <desc>An Entity is an instance of an Entity Schema. Links connect an Entity, by role, key, validity timerange and tier, to TAMS Flows and Sources and to TADS Tracks. Collections group Entities. TAMS and TADS keep their own relationships: flow collections and track timeline references.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>

  <!-- TEDS -->
  <rect x="20" y="20" width="400" height="430" rx="10" fill="#fdf2f7" stroke="#ad1457" stroke-width="1.5"/>
  <text x="36" y="44" font-size="15" font-weight="bold" fill="#ad1457">TEDS</text>

  <rect x="60" y="64" width="200" height="56" rx="6" fill="#fff" stroke="#444"/>
  <text x="160" y="87" text-anchor="middle" font-weight="bold">Entity Schema</text>
  <text x="160" y="106" text-anchor="middle" fill="#555">metadata · roles · facets</text>

  <rect x="60" y="180" width="200" height="56" rx="6" fill="#fff" stroke="#444"/>
  <text x="160" y="203" text-anchor="middle" font-weight="bold">Entity</text>
  <text x="160" y="222" text-anchor="middle" fill="#555">e.g. a channel, a clip</text>

  <line x1="160" y1="180" x2="160" y2="124" stroke="#444" marker-end="url(#arrow)"/>
  <text x="168" y="156" fill="#555">instance of</text>

  <rect x="60" y="360" width="200" height="56" rx="6" fill="#fff" stroke="#444"/>
  <text x="160" y="383" text-anchor="middle" font-weight="bold">Collection</text>
  <text x="160" y="402" text-anchor="middle" fill="#555">static list, or a rule</text>

  <line x1="160" y1="360" x2="160" y2="240" stroke="#444" marker-end="url(#arrow)"/>
  <text x="168" y="304" fill="#555">groups</text>

  <rect x="290" y="180" width="110" height="56" rx="6" fill="#fff" stroke="#444"/>
  <text x="345" y="203" text-anchor="middle" font-weight="bold">Link</text>
  <text x="345" y="222" text-anchor="middle" fill="#555">role · key</text>
  <line x1="260" y1="208" x2="286" y2="208" stroke="#444" marker-end="url(#arrow)"/>
  <text x="345" y="258" text-anchor="middle" fill="#555">validity · tier</text>

  <!-- TAMS -->
  <rect x="460" y="20" width="400" height="200" rx="10" fill="#eef8f7" stroke="#009688" stroke-width="1.5"/>
  <text x="476" y="44" font-size="15" font-weight="bold" fill="#00796b">TAMS</text>
  <rect x="490" y="64" width="150" height="50" rx="6" fill="#fff" stroke="#444"/>
  <text x="565" y="94" text-anchor="middle" font-weight="bold">Flow (av)</text>
  <rect x="690" y="64" width="150" height="50" rx="6" fill="#fff" stroke="#444"/>
  <text x="765" y="94" text-anchor="middle" font-weight="bold">Flow (thumbnails)</text>
  <line x1="640" y1="89" x2="686" y2="89" stroke="#444" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="663" y="135" text-anchor="middle" fill="#555">flow_collection</text>
  <rect x="490" y="150" width="150" height="50" rx="6" fill="#fff" stroke="#444"/>
  <text x="565" y="180" text-anchor="middle" font-weight="bold">Source</text>

  <!-- TADS -->
  <rect x="460" y="250" width="400" height="200" rx="10" fill="#eef4fb" stroke="#00838f" stroke-width="1.5"/>
  <text x="476" y="274" font-size="15" font-weight="bold" fill="#00838f">TADS</text>
  <rect x="490" y="294" width="150" height="50" rx="6" fill="#fff" stroke="#444"/>
  <text x="565" y="316" text-anchor="middle" font-weight="bold">Track</text>
  <text x="565" y="333" text-anchor="middle" fill="#555">loudness · main</text>
  <rect x="690" y="294" width="150" height="50" rx="6" fill="#fff" stroke="#444"/>
  <text x="765" y="316" text-anchor="middle" font-weight="bold">Track</text>
  <text x="765" y="333" text-anchor="middle" fill="#555">subtitles · cy</text>
  <rect x="490" y="380" width="150" height="50" rx="6" fill="#fff" stroke="#444"/>
  <text x="565" y="402" text-anchor="middle" font-weight="bold">Track (tier 60 s)</text>
  <text x="565" y="419" text-anchor="middle" fill="#555">loudness rollup</text>
  <line x1="565" y1="380" x2="565" y2="348" stroke="#444" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="575" y="368" fill="#555">rollup of</text>

  <!-- timeline reference: TADS track -> TAMS flow -->
  <path d="M 640 319 C 680 260, 680 150, 640 100" fill="none" stroke="#444" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="690" y="215" fill="#555">timeline_reference</text>

  <!-- links from TEDS -->
  <line x1="400" y1="196" x2="486" y2="96" stroke="#ad1457" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="208" x2="486" y2="175" stroke="#ad1457" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="222" x2="486" y2="318" stroke="#ad1457" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
